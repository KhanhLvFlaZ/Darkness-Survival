# Fast training configuration for quick iteration and testing
# Use this for rapid prototyping and debugging

behaviors:
  MonsterBehavior:
    trainer_type: ppo
    hyperparameters:
      learning_rate: 5.0e-4  # Higher for faster learning
      learning_rate_schedule: constant
      batch_size: 512  # Smaller for faster updates
      buffer_size: 5120
      num_epoch: 3
      beta: 1.0e-2  # Higher entropy for more exploration
      epsilon: 0.2
      lambd: 0.95
      
    network_settings:
      hidden_units: 128  # Smaller network for faster training
      num_layers: 2
      normalize: true
      
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    max_steps: 1.0e6  # 1 million steps
    time_horizon: 500
    summary_freq: 5000
    keep_checkpoints: 3
    checkpoint_interval: 25000

env_settings:
  num_envs: 8  # More parallel environments
  no_graphics: true  # Disable graphics for speed
  time_scale: 20
  quality_level: 0  # Lowest quality for speed

engine_settings:
  width: 84
  height: 84
  quality_level: 0
  time_scale: 20
  target_frame_rate: -1

# Training command:
# mlagents-learn config/monster_training_fast.yaml --run-id=monster_fast_test
