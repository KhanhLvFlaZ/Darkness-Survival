# High-quality training configuration for final models
# Use this for production-ready AI with best performance

behaviors:
  MonsterBehavior:
    trainer_type: ppo
    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: linear  # Gradual decrease
      batch_size: 2048  # Larger for stability
      buffer_size: 20480
      num_epoch: 5  # More passes through data
      beta: 5.0e-4  # Lower entropy for exploitation
      epsilon: 0.2
      lambd: 0.95
      
    network_settings:
      hidden_units: 512  # Larger network for more capacity
      num_layers: 3  # Deeper network
      normalize: true
      
    reward_signals:
      extrinsic:
        gamma: 0.995  # Higher discount for long-term planning
        strength: 1.0
      
      # Curiosity-driven exploration (optional)
      curiosity:
        gamma: 0.99
        strength: 0.01
        encoding_size: 128
        learning_rate: 3.0e-4
    
    max_steps: 1.0e7  # 10 million steps
    time_horizon: 2000  # Longer horizon for complex behaviors
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 100000

env_settings:
  num_envs: 4
  no_graphics: false  # Keep graphics for monitoring
  time_scale: 10  # Moderate speed for stability
  quality_level: 3

engine_settings:
  width: 256
  height: 256
  quality_level: 3
  time_scale: 10
  target_frame_rate: 60

# Training command:
# mlagents-learn config/monster_training_quality.yaml --run-id=monster_quality_v1

# This configuration will take longer but produce higher quality results
# Recommended for final production models
